apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: buurman-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/MaartenHanze/buurman-en-buurman-it.git'
    targetRevision: HEAD
    path: buurman-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true