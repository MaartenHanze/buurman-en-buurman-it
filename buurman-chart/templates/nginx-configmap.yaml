apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.nginx.configMapName }}
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }

      location /app1/ {
        proxy_pass http://{{ .Values.apache1.serviceName }}:{{ .Values.apache1.servicePort }}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }

      location /app2/ {
        proxy_pass http://{{ .Values.apache2.serviceName }}:{{ .Values.apache2.servicePort }}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
    }
