apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.apache2.name }}
  labels:
    app: {{ .Values.apache2.name }}
spec:
  replicas: {{ .Values.apache2.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.apache2.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.apache2.name }}
    spec:
      containers:
        - name: apache
          image: "{{ .Values.apache2.image.repository }}:{{ .Values.apache2.image.tag }}"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/local/apache2/htdocs
      volumes:
        - name: content
          configMap:
            name: {{ .Values.apache2.name }}-content
